<svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric illustration of a clinic building">
  <!-- ground -->
  <polygon points="230,220 455,330 230,440 5,330" fill="#9CCF5A"/>
  <polygon points="5,330 230,440 230,460 5,350" fill="#7FB947"/>
  <polygon points="455,330 230,440 230,460 455,350" fill="#8FC752"/>

  <!-- building: left (shaded) face -->
  <polygon points="230,400 105.2,328 105.2,121.6 230,193.6" fill="#C7D0D6"/>
  <!-- building: right (lit) face -->
  <polygon points="230,400 386,310 386,103.6 230,193.6" fill="#E9EDF0"/>
  <!-- roof -->
  <polygon points="230,193.6 386,103.6 261.2,31.6 105.2,121.6" fill="#DCE3E8" stroke="#C3CDD3" stroke-width="2"/>

  <!-- left-face window bands -->
  <g fill="#2E86C6">
    <polygon points="105.2,313 230,385 230,373 105.2,301"/>
    <polygon points="105.2,278 230,350 230,338 105.2,266"/>
    <polygon points="105.2,243 230,315 230,303 105.2,231"/>
    <polygon points="105.2,163 230,235 230,223 105.2,151"/>
  </g>
  <!-- right-face window bands -->
  <g fill="#5FC1EE">
    <polygon points="230,385 386,295 386,283 230,373"/>
    <polygon points="230,350 386,260 386,248 230,338"/>
    <polygon points="230,315 386,225 386,213 230,303"/>
    <polygon points="230,235 386,145 386,133 230,223"/>
  </g>

  <!-- clinic ribbon sign -->
  <g transform="translate(308,210) rotate(-30)">
    <rect x="-92" y="-17" width="184" height="34" rx="5" fill="#38A34A" stroke="#2E8A3D" stroke-width="2"/>
    <text x="0" y="7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CLINIC</text>
  </g>

  <!-- entrance canopy -->
  <polygon points="180,410 247.6,371 195.6,341 128,380" fill="#8892A0"/>
  <polygon points="128,380 195.6,341 195.6,351 128,390" fill="#6E7885"/>
  <polygon points="195.6,341 247.6,371 247.6,381 195.6,351" fill="#7A8492"/>
  <rect x="177" y="410" width="6" height="35" fill="#A9B1BB"/>
  <rect x="244.6" y="371" width="6" height="35" fill="#A9B1BB"/>

  <!-- glass door -->
  <polygon points="150,398 213,362 213,412 150,448" fill="#BEE3F8" fill-opacity="0.85" stroke="#8FBFDD" stroke-width="2"/>
  <line x1="181.5" y1="380" x2="181.5" y2="430" stroke="#8FBFDD" stroke-width="2"/>

  <!-- cross badge -->
  <circle cx="214" cy="396" r="19" fill="#E5484D" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M214 388v16M206 396h16" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- trees -->
  <g>
    <rect x="52" y="358" width="8" height="22" fill="#8A5A34"/>
    <circle cx="56" cy="345" r="20" fill="#6FAE3D"/>
    <circle cx="44" cy="352" r="14" fill="#7FBE49"/>
    <circle cx="68" cy="352" r="14" fill="#7FBE49"/>
  </g>
  <g>
    <rect x="402" y="358" width="8" height="22" fill="#8A5A34"/>
    <circle cx="406" cy="345" r="20" fill="#6FAE3D"/>
    <circle cx="394" cy="352" r="14" fill="#7FBE49"/>
    <circle cx="418" cy="352" r="14" fill="#7FBE49"/>
  </g>
</svg>
